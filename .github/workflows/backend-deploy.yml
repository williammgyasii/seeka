name: Backend Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Backend
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.CLOUDFLARE_PAGES_URL }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_URL: ${{ vars.CLOUDFLARE_PAGES_URL }}
    steps:
      - name: Checkout released revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release revision belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and test backend
        run: |
          dotnet restore Seeka.slnx
          dotnet test Seeka.slnx --no-restore --configuration Release

      - name: Apply database migrations
        env:
          ConnectionStrings__Seeka: ${{ secrets.NEON_CONNECTION_STRING }}
        run: dotnet run --project seeka-backend/Seeka.Api --configuration Release -- --migrate

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: seeka-edge/package-lock.json

      - name: Install and test edge adapter
        run: |
          npm ci
          npm test
          npm run typecheck
        working-directory: seeka-edge

      - name: Configure database secret
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        run: printf '%s' "$DATABASE_CONNECTION_STRING" | npx wrangler secret put DATABASE_CONNECTION_STRING
        working-directory: seeka-edge

      - name: Deploy Worker and container
        run: npx wrangler deploy
        working-directory: seeka-edge

      - name: Smoke test API
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 "$CLOUDFLARE_PAGES_URL/api/health"
