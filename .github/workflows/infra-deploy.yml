name: Infrastructure Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: Infrastructure
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.CLOUDFLARE_PAGES_URL }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout released revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release revision belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Mint temporary state credentials
        run: |
          verify="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          parent_access_key_id="$(printf '%s' "$verify" | jq -r '.result.id')"
          payload="$(jq -n \
            --arg bucket "seeka-terraform-state" \
            --arg parent "$parent_access_key_id" \
            '{bucket:$bucket,parentAccessKeyId:$parent,permission:"object-read-write",ttlSeconds:3600}')"
          credentials="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/temp-access-credentials" \
            --data "$payload")"
          access_key_id="$(printf '%s' "$credentials" | jq -r '.result.accessKeyId')"
          secret_access_key="$(printf '%s' "$credentials" | jq -r '.result.secretAccessKey')"
          session_token="$(printf '%s' "$credentials" | jq -r '.result.sessionToken')"
          echo "::add-mask::$access_key_id"
          echo "::add-mask::$secret_access_key"
          echo "::add-mask::$session_token"
          {
            echo "AWS_ACCESS_KEY_ID=$access_key_id"
            echo "AWS_SECRET_ACCESS_KEY=$secret_access_key"
            echo "AWS_SESSION_TOKEN=$session_token"
            echo "AWS_REGION=auto"
            echo "AWS_ENDPOINT_URL_S3=https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          } >> "$GITHUB_ENV"

      - name: Apply infrastructure
        run: |
          terraform init -input=false
          terraform plan -input=false -out=seeka.tfplan
          terraform apply -input=false -auto-approve seeka.tfplan
        working-directory: infra/cloudflare
