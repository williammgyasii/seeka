name: Infrastructure Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: Infrastructure
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.CLOUDFLARE_PAGES_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Checkout released revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release revision belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Apply infrastructure
        run: |
          terraform init -input=false
          terraform plan -input=false -out=seeka.tfplan
          terraform apply -input=false -auto-approve seeka.tfplan
        working-directory: infra/cloudflare
