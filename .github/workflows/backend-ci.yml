name: Backend CI

on:
  pull_request:
    paths:
      - "Seeka.slnx"
      - "seeka-backend/**"
      - "seeka-backend.Tests/**"
      - ".github/workflows/backend-*.yml"
  push:
    branches:
      - main
    paths:
      - "Seeka.slnx"
      - "seeka-backend/**"
      - "seeka-backend.Tests/**"
      - ".github/workflows/backend-*.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Seeka.slnx

      - name: Test
        run: dotnet test Seeka.slnx --no-restore --configuration Release

      - name: Build
        run: dotnet build Seeka.slnx --no-restore --configuration Release
