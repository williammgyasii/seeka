name: Frontend Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Frontend
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.CLOUDFLARE_PAGES_URL }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_URL: ${{ vars.CLOUDFLARE_PAGES_URL }}
    steps:
      - name: Checkout released revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release revision belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            seeka-frontend/package-lock.json
            seeka-edge/package-lock.json

      - name: Install, test, and build frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
        working-directory: seeka-frontend

      - name: Verify Pages functions
        run: |
          npm ci
          npx vitest run test/pages-proxy.test.ts test/canonical-host.test.ts
        working-directory: seeka-edge

      - name: Deploy Pages
        run: npx --prefix .. wrangler pages deploy ../../seeka-frontend/dist --project-name seeka --branch main
        working-directory: seeka-edge/pages

      - name: Smoke test frontend
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 "$CLOUDFLARE_PAGES_URL/"
