name: Marketing Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-marketing
  cancel-in-progress: false

jobs:
  deploy:
    name: Marketing
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://seekajobs.tech
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: seeka-marketing
    steps:
      - name: Checkout released revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release revision belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: seeka-marketing/package-lock.json

      - name: Install, build, and test
        run: |
          npm ci
          npm run build
          npm test

      # Run from seeka-marketing so Wrangler bundles functions/_middleware.ts.
      - name: Deploy Pages
        run: npx wrangler pages deploy dist --project-name seeka-marketing --branch main

      - name: Smoke test site
        run: |
          curl --fail --show-error --silent --retry 30 --retry-delay 10 --retry-all-errors https://seekajobs.tech/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://www.seekajobs.tech/)" = "301"
