schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - >-
      Include a "## How we sell it" section: the one-sentence promise to a job
      seeker, who it is for, what it does NOT do, and the marketing page or
      guide it changes on seekajobs.tech. For a change users never see, write
      "No marketing change" and the reason.
  tasks:
    - >-
      If the proposal sells something, add a final task group "Marketing" that
      updates seeka-marketing in the same release as the feature, with a site
      test for the new copy. Never describe unreleased work as available;
      label it "coming soon".

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
